name: Draft research prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching pyproject.toml (for example v0.8.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require trusted main and a semantic version
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require canonical version and successful quality gate
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as file:
              version = tomllib.load(file)['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match canonical project version'
          PY
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.check_runs | any(.name == "quality-gate" and .conclusion == "success")' | grep -qx true
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::Release already exists; inspect it instead of replacing it'
            exit 1
          fi
      - name: Create draft prerelease only
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "OsteoPatch Review $RELEASE_TAG — research preview" --notes-file docs/release-notes.md
