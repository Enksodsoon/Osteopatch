name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OSTEOPATCH_RUNTIME_ARTIFACTS: ""
  UV_PYTHON: "3.12"

jobs:
  backend:
    name: backend (torch-free)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Verify the serve environment is torch-free
        run: |
          if uv run --locked python -c "import torch" 2>/dev/null; then
            echo "::error::The web environment must remain torch-free"
            exit 1
          fi
      - name: Test both backends
        run: uv run --locked pytest app/g6/backend/tests app/g7-enterprise/backend/tests -q -rs
      - name: Verify dependency contracts
        run: |
          uv run --locked python scripts/sync_requirements.py --check
          uv run --locked python scripts/check_deps.py

  frontend-g6:
    name: frontend (g6)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/g6/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/g6/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  frontend-enterprise:
    name: frontend (enterprise)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/g7-enterprise/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/g7-enterprise/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  static:
    name: static (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Blocking Ruff scope
        run: uv run --locked ruff check scripts tests/tooling app/g6/backend/osteopatch/pathology app/g6/backend/osteopatch/app.py app/g6/backend/osteopatch/limitations.py app/g6/backend/osteopatch/projects.py app/g6/backend/osteopatch/modelcard.py app/g6/backend/tests/test_connection_concurrency.py app/g6/deploy/verify_bake.py
      - run: uv run --locked mypy

  repository:
    name: repository (docs + safety)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests/tooling -v
      - run: python scripts/check_repository.py
      - run: python scripts/build_site.py
      - run: python scripts/check_site.py

  quality-gate:
    name: quality-gate
    if: always()
    needs: [backend, frontend-g6, frontend-enterprise, static, repository]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every mandatory job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, value in results.items() if value['result'] != 'success']
          print('Mandatory gates:', {name: value['result'] for name, value in results.items()})
          sys.exit(bool(failed))
          PY
