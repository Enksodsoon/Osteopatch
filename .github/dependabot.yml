version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: deps
  - package-ecosystem: npm
    directories: [/app/g6/frontend, /app/g7-enterprise/frontend]
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      frontend-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: deps
